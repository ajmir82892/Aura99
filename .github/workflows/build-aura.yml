name: Build Aura APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleFossDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show error on summary page
        if: failure()
        run: |
          echo "### Build error" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          (grep -m2 -A14 -E "What went wrong|Caused by|^e: " build.log || head -40 build.log) | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: Aura-APK
          path: app/build/outputs/apk/**/*.apk
